worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;

        location /users/ {
            set $users_upstream users:8081;
            proxy_pass http://$users_upstream/;
            include proxy_headers.conf;
        }

        location /teacolito/ {
            set $teacolito_upstream teacolito:8080;
            proxy_pass http://$teacolito_upstream/;
            include proxy_headers.conf;
        }
    }
}
