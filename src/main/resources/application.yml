server:
  port: 8080

spring:
  application:
    name: teacolito

  # ==========================================================================================
  # Base de datos: H2 en memoria, usada para desarrollo y pruebas locales.
  #
  # Para desplegar en la nube (por ejemplo con Docker + PostgreSQL) reemplaza el bloque
  # `datasource` y el dialecto de `jpa.properties.hibernate.dialect` de esta forma:
  #
  # spring:
  #   datasource:
  #     url: jdbc:postgresql://<host>:5432/<database>
  #     username: <usuario>
  #     password: <password>
  #     driver-class-name: org.postgresql.Driver
  #   jpa:
  #     properties:
  #       hibernate:
  #         dialect: org.hibernate.dialect.PostgreSQLDialect
  #
  # y agrega en build.gradle.kts la dependencia:
  #   runtimeOnly("org.postgresql:postgresql")
  # (la dependencia de H2 puede quedarse solo para el perfil de tests, o eliminarse).
  # ==========================================================================================
  datasource:
    url: jdbc:h2:mem:teacolito;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_yzwNALI2A
