worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    resolver 127.0.0.11 valid=10s;

    # nginx runs on port 80 inside the container but is published as 9090 on the
    # host. Its automatic trailing-slash redirects (e.g. /users -> /users/) build
    # an absolute URL from its own internal port by default, dropping the real
    # published port entirely. A relative redirect lets the client resolve it
    # against whatever host:port it actually used to reach us.
    absolute_redirect off;

    server {
        listen 80;

        # users may not be built/running yet during early phases of the project,
        # so it resolves its upstream dynamically per request instead of at nginx
        # startup — a missing/unbuilt service returns 502 instead of blocking the
        # whole gateway from starting.
        location /users/ {
            set $users_upstream http://users:8081;
            rewrite ^/users/(.*)$ /$1 break;
            proxy_pass $users_upstream;
            include proxy_headers.conf;
        }

        location /teacolito/ {
            rewrite ^/teacolito/(.*)$ /$1 break;
            proxy_pass http://teacolito:8080;
            include proxy_headers.conf;
        }
    }
}
